name: Keep Supabase alive

on:
  schedule:
    - cron: "0 8 */3 * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Supabase REST endpoint
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          # The publishable key (sb_publishable_...) is safe in CI; never use a secret key here.
          curl -fsS "$SUPABASE_URL/rest/v1/keep-alive?select=id&limit=1" -H "apikey: $SUPABASE_PUBLISHABLE_KEY"
